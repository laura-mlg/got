# This configuration was generated with the setup-qlty-toml skill.
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/*.d.ts",
  "**/benchmark/**",
  "**/documentation/examples/**",
]

test_patterns = [
  "**/test/**",
  "**/*.test.*",
]

[smells]
mode = "comment"

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

# Config stored in .qlty/configs/ to keep repo root clean.
# Uses .eslintrc.cjs (explicit CJS) because got is an ESM project ("type":"module").
[[plugin]]
name = "eslint"
mode = "comment"
config_files = [".qlty/configs/.eslintrc.cjs"]
affects_cache = ["tsconfig.json"]
extra_packages = [
  "@typescript-eslint/parser@7.18.0",
  "@typescript-eslint/eslint-plugin@7.18.0",
]

# skip_upstream prevents tsc from type-checking all upstream imports — only analyzes the diff.
[[plugin]]
name = "tsc"
mode = "comment"
skip_upstream = true

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"
