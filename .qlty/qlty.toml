# This configuration was generated with the setup-qlty-toml skill.
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/*.d.ts",
  "**/benchmark/**",
  "**/documentation/examples/**",
]

test_patterns = [
  "**/test/**",
  "**/*.test.*",
]

[smells]
mode = "comment"

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

# skip_upstream prevents tsc from type-checking all upstream imports — only the diff.
# affects_cache ensures cache is invalidated when tsconfig.json changes.
[[plugin]]
name = "tsc"
mode = "comment"
skip_upstream = true
affects_cache = ["tsconfig.json"]

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

# Config stored in .qlty/configs/ to keep repo root clean.
# got uses xo as its linter (eslint wrapper) — no raw eslint plugin needed.
[[plugin]]
name = "markdownlint"
mode = "comment"
config_files = [".qlty/configs/.markdownlint.json"]

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"
